name: CI

env:
  php_version: "8.2"
  blob_name: "simpay-wordpress-*.zip"
  archive_format: "zip"

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
            fetch-depth: 1
            
    - name: Install dependencies
      uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # v6.1.2
      with:
        php_version: ${{ env.php_version }}
        command: install
        args: --no-dev --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative
        
    - name: Archive project
      if: success() || failure()
      uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # v6.1.2
      with:
        php_version: ${{ env.php_version }}
        command: archive
        args: --format=${{ env.archive_format }}
        
    - name: Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      if: success() || failure()
      with:
        files: ${{ env.blob_name }}
        tag_name: ${{ inputs.version }}
